<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - LeavePortal</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/notifications.js"></script>
</head>
<body>
    <div class="app-layout">
        <div id="sidebar-container"></div>

        <div class="app-main">
            <div id="navbar-container"></div>

            <main class="app-content">
                <div class="page-header">
                    <div class="page-title">
                        <h2>Notifications</h2>
                        <p>Real-time updates regarding your leave approvals, rejections, and company notices.</p>
                    </div>
                    <div>
                        <button class="btn btn-outline" onclick="markAllNotificationsRead()">Mark All as Read</button>
                    </div>
                </div>

                <div class="content-card" style="max-width: 800px; margin: 0 auto; padding: 0;">
                    <div id="notificationsList">
                        <div class="table-empty">Loading notifications...</div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        Auth.requireRole(['employee', 'hr', 'admin']);
        initAppLayout('notifications', 'Notifications');
        loadNotificationsPage();
    </script>
</body>
</html>
