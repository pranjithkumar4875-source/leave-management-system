<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Employees - LeavePortal</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/tables.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/employees.js"></script>
</head>
<body>
    <div class="app-layout">
        <div id="sidebar-container"></div>

        <div class="app-main">
            <div id="navbar-container"></div>

            <main class="app-content">
                <div class="page-header">
                    <div class="page-title">
                        <h2>Employee Directory</h2>
                        <p>Manage employee records, view profile details, and update organizational status.</p>
                    </div>
                    <div style="display:flex; gap:10px;">
                        <a href="/admin/import-employees.html" class="btn btn-outline">
                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            Import CSV
                        </a>
                        <button class="btn btn-primary" onclick="openModal('addEmployeeModal')">
                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            Add New Employee
                        </button>
                    </div>
                </div>

                <div class="table-wrapper">
                    <!-- Search and Filter Toolbar -->
                    <div class="table-toolbar">
                        <div class="search-box">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            <input type="text" id="employeeSearchInput" class="form-control" placeholder="Search by name, ID, email..." oninput="loadEmployeesTable(1)">
                        </div>

                        <div class="filter-group">
                            <select id="employeeDeptFilter" class="form-control" onchange="loadEmployeesTable(1)" style="min-width:160px;">
                                <option value="">All Departments</option>
                                <option value="Engineering">Engineering</option>
                                <option value="Human Resources">Human Resources</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Product Design">Product Design</option>
                                <option value="Administration">Administration</option>
                            </select>

                            <select id="employeeStatusFilter" class="form-control" onchange="loadEmployeesTable(1)" style="min-width:130px;">
                                <option value="">All Statuses</option>
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Employee ID</th>
                                    <th>Employee Name</th>
                                    <th>Department</th>
                                    <th>Designation</th>
                                    <th>Annual Salary</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="employeesTableBody">
                                <tr><td colspan="7" class="table-empty">Loading employees...</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="table-pagination" id="employeePagination"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Add Employee Modal -->
    <div class="modal" id="addEmployeeModal">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3>Add New Employee</h3>
                <button class="modal-close" onclick="closeModal('addEmployeeModal')">&times;</button>
            </div>
            <form id="addEmployeeForm">
                <div class="modal-body">
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
                        <div class="form-group">
                            <label for="newEmpId" class="label-required">Employee ID</label>
                            <input type="text" id="newEmpId" class="form-control" placeholder="e.g. EMP010" required>
                        </div>
                        <div class="form-group">
                            <label for="newFullName" class="label-required">Full Name</label>
                            <input type="text" id="newFullName" class="form-control" placeholder="e.g. Alice Green" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="newSalary" class="label-required">Annual Salary (₹)</label>
                        <input type="number" id="newSalary" class="form-control" min="0" step="0.01" placeholder="e.g. 750000" required>
                    </div>

                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
                        <div class="form-group">
                            <label for="newEmail" class="label-required">Email</label>
                            <input type="email" id="newEmail" class="form-control" placeholder="alice@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="newPhone">Phone</label>
                            <input type="tel" id="newPhone" class="form-control" placeholder="+1-555-0155">
                        </div>
                    </div>

                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
                        <div class="form-group">
                            <label for="newDepartment" class="label-required">Department</label>
                            <select id="newDepartment" class="form-control" required>
                                <option value="Engineering">Engineering</option>
                                <option value="Human Resources">Human Resources</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Product Design">Product Design</option>
                                <option value="Finance">Finance</option>
                                <option value="Administration">Administration</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="newDesignation" class="label-required">Designation</label>
                            <input type="text" id="newDesignation" class="form-control" placeholder="e.g. QA Engineer" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="newPassword" class="label-required">Initial Password</label>
                        <input type="password" id="newPassword" class="form-control" placeholder="Default login password" value="emp123" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('addEmployeeModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Employee</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Employee Modal -->
    <div class="modal" id="editEmployeeModal">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3>Edit Employee Record</h3>
                <button class="modal-close" onclick="closeModal('editEmployeeModal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editEmpId">
                <div class="form-group">
                    <label for="editFullName" class="label-required">Full Name</label>
                    <input type="text" id="editFullName" class="form-control" required>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
                    <div class="form-group">
                        <label for="editEmail">Email (Read-only)</label>
                        <input type="email" id="editEmail" class="form-control" readonly style="opacity:0.7;">
                    </div>
                    <div class="form-group">
                        <label for="editPhone">Phone</label>
                        <input type="tel" id="editPhone" class="form-control">
                    </div>
                </div>
                <div class="form-group">
                    <label for="editSalary" class="label-required">Annual Salary (₹)</label>
                    <input type="number" id="editSalary" class="form-control" min="0" step="0.01" required>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
                    <div class="form-group">
                        <label for="editDepartment" class="label-required">Department</label>
                        <select id="editDepartment" class="form-control">
                            <option value="Engineering">Engineering</option>
                            <option value="Human Resources">Human Resources</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Product Design">Product Design</option>
                            <option value="Finance">Finance</option>
                            <option value="Administration">Administration</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editDesignation" class="label-required">Designation</label>
                        <input type="text" id="editDesignation" class="form-control" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="editStatus">Status</label>
                    <select id="editStatus" class="form-control">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('editEmployeeModal')">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="submitEditEmployee()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        Auth.requireRole(['admin']);
        initAppLayout('employees', 'Manage Employees');
        loadEmployeesTable(1);

        // Add Employee submit
        document.getElementById('addEmployeeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const employeeId = document.getElementById('newEmpId').value.trim();
            const fullName = document.getElementById('newFullName').value.trim();
            const email = document.getElementById('newEmail').value.trim();
            const phone = document.getElementById('newPhone').value.trim();
            const department = document.getElementById('newDepartment').value;
            const designation = document.getElementById('newDesignation').value.trim();
            const salary = document.getElementById('newSalary').value;
            const password = document.getElementById('newPassword').value;

            try {
                const res = await API.post('/employees', {
                    employeeId, fullName, email, phone, department, designation, salary, password
                });
                showToast(res.message || 'Employee created successfully!', 'success');
                closeModal('addEmployeeModal');
                document.getElementById('addEmployeeForm').reset();
                loadEmployeesTable(1);
            } catch (err) {
                showToast(err.message, 'danger');
            }
        });
    </script>
</body>
</html>
