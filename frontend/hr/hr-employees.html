<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Directory - HR Portal</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/tables.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/employees.js"></script>
</head>
<body>
    <div class="app-layout">
        <div id="sidebar-container"></div>

        <div class="app-main">
            <div id="navbar-container"></div>

            <main class="app-content">
                <div class="page-header">
                    <div class="page-title">
                        <h2>Staff Directory</h2>
                        <p>View employee profiles, departments, contact info, and annual leave status.</p>
                    </div>
                </div>

                <div class="table-wrapper">
                    <!-- Search & Filter -->
                    <div class="table-toolbar">
                        <div class="search-box">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            <input type="text" id="employeeSearchInput" class="form-control" placeholder="Search by name, ID, email..." oninput="loadEmployeesTable(1)">
                        </div>

                        <div class="filter-group">
                            <select id="employeeDeptFilter" class="form-control" onchange="loadEmployeesTable(1)" style="min-width:160px;">
                                <option value="">All Departments</option>
                                <option value="Engineering">Engineering</option>
                                <option value="Human Resources">Human Resources</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Product Design">Product Design</option>
                                <option value="Administration">Administration</option>
                            </select>

                            <select id="employeeStatusFilter" class="form-control" onchange="loadEmployeesTable(1)" style="min-width:130px;">
                                <option value="">All Statuses</option>
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Employee ID</th>
                                    <th>Employee Name</th>
                                    <th>Department</th>
                                    <th>Designation</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="employeesTableBody">
                                <tr><td colspan="6" class="table-empty">Loading employees...</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="table-pagination" id="employeePagination"></div>
                </div>
            </main>
        </div>
    </div>

    <script>
        Auth.requireRole(['hr', 'admin']);
        initAppLayout('employees', 'Staff Directory');
        loadEmployeesTable(1);
    </script>
</body>
</html>
