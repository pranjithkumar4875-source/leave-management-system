<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Leave Request Management System</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/common.js"></script>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-box">
            <div class="auth-logo">
                <div class="logo-badge">HR</div>
                <h1>Reset Password</h1>
                <p>Recover access to your HRMS account</p>
            </div>

            <!-- Step 1: Send Request -->
            <form id="forgotForm">
                <div class="form-group">
                    <label for="resetEmail" class="label-required">Registered Email</label>
                    <input type="email" id="resetEmail" class="form-control" placeholder="name@example.com" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">
                    Send Verification Code
                </button>
            </form>

            <!-- Step 2: Verify & Reset (Hidden initially) -->
            <form id="verifyResetForm" style="display: none; margin-top: 20px;">
                <div class="form-group">
                    <label for="verificationCode" class="label-required">Verification Code</label>
                    <input type="text" id="verificationCode" class="form-control" placeholder="Enter 6-digit code" required>
                </div>

                <div class="form-group">
                    <label for="newPassword" class="label-required">New Password</label>
                    <input type="password" id="newPassword" class="form-control" placeholder="Min. 6 characters" minlength="6" required>
                </div>

                <button type="submit" class="btn btn-success" style="width: 100%; padding: 12px;">
                    Confirm & Update Password
                </button>
            </form>

            <div class="auth-footer">
                Remember your password? <a href="/login.html">Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        let targetEmail = '';

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            targetEmail = document.getElementById('resetEmail').value.trim();
            const btn = e.target.querySelector('button');
            btn.disabled = true;

            try {
                const res = await API.post('/auth/forgot-password', { email: targetEmail });
                showToast(res.message, 'success');
                if (res.demoCode) {
                    document.getElementById('verificationCode').value = res.demoCode;
                }
                document.getElementById('forgotForm').style.display = 'none';
                document.getElementById('verifyResetForm').style.display = 'block';
            } catch (err) {
                showToast(err.message, 'danger');
                btn.disabled = false;
            }
        });

        document.getElementById('verifyResetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resetToken = document.getElementById('verificationCode').value.trim();
            const newPassword = document.getElementById('newPassword').value;

            try {
                const res = await API.post('/auth/reset-password', {
                    email: targetEmail,
                    resetToken,
                    newPassword
                });
                showToast(res.message, 'success');
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 1200);
            } catch (err) {
                showToast(err.message, 'danger');
            }
        });
    </script>
</body>
</html>
