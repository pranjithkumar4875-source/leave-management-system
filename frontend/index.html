<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Request Management System - HRMS</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0b0f19 75%);">
    <div style="text-align:center; max-width:500px; padding:30px;">
        <div class="logo-badge" style="margin-bottom:20px;">HR</div>
        <h1 style="font-size:28px; margin-bottom:12px;">Leave Request Management System</h1>
        <p class="text-secondary" style="margin-bottom:24px;">Enterprise-grade HR leave workflow, tracking, approvals, and analytics platform.</p>
        <div style="display:flex; gap:12px; justify-content:center;">
            <a href="/login.html" class="btn btn-primary">Go to Login</a>
            <a href="/register.html" class="btn btn-secondary">Create Employee Account</a>
        </div>
    </div>
    <script>
        // Check session and redirect if logged in
        if (Auth.isAuthenticated()) {
            const user = Auth.getCurrentUser();
            Auth.redirectByRole(user.role);
        }
    </script>
</body>
</html>
